spring:
  application:
    name: mcs-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mcs_db}
    username: ${DB_USERNAME:mcs_api}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

logging:
  level:
    root: INFO
    vinch.mcs.api: DEBUG

mcs:
  api:
    lobby-key: ${LOBBY_API_KEY}
  ports:
    # Plage globale du VPS, découpée en blocs de "per-node" ports par machine.
    # Surchargeable par variables d'environnement (MCS_PORTS_START, ...).
    start: 25600
    end: 29999
    per-node: 20
  nodes:
    # Part de la capacité prêtée par chaque volontaire gardée en réserve (en %)
    reserve-percent: 10
  velocity:
    url: http://127.0.0.1:8082
    plugin-key: ${VELOCITY_PLUGIN_KEY}  backup:
    # Activé par "sudo mcs-add-backup" sur le VPS (MCS_BACKUP_ENABLED dans api.env)
    enabled: ${MCS_BACKUP_ENABLED:false}
    # Serveur de sauvegarde, joint par les machines à travers le VPS (wg-mcs + tunnel SSH)
    repo-base: http://10.99.0.1:8100
    # Politique par défaut ; les rôles (méta LuckPerms) et les admins la remplacent
    default-interval-hours: 24
    default-keep-last: 3
    default-keep-weekly: 4
