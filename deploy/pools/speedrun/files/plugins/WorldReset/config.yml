# Lot 76 — WorldReset pour le speedrun (posé à la création du serveur, jamais écrasé ensuite).
# Les clés absentes prennent la valeur par défaut du plugin.
# En jeu (permissions données par img-farm, voir plugins/ImgFarm/permissions-joueurs.yml) :
#   /wr reset                         nouveau monde (et chrono à zéro)
#   /wr timer goal ITEM diamond       changer le but (ENTITY, ITEM, BLOCK, ADVANCEMENT, PORTAL, NONE)
#   /wr death 1                       une mort = monde neuf (/wr death off pour couper)
language: en
# Pas de reset à la mort (0 = désactivé)
death-limit: 0
reset-on-death: false
backup:
  # Mondes jetables : pas de copie à chaque reset (sinon le disque se remplit)
  enabled: false
autoreset:
  enabled: false
timer:
  enabled: true
  # Chacun son chrono (plusieurs joueurs peuvent être sur le même serveur)
  scope: INDIVIDUAL
  goal:
    type: ENTITY
    value: minecraft:ender_dragon
