# Configuration du plugin ProxyManager

# URL de l'API centrale
api-url: http://localhost:8081

# Clé API pour s'authentifier auprès de l'API centrale
api-key: CHANGE_ME

# Port de l'API locale exposée par ce plugin (pour que l'API Spring puisse parler à Velocity)
local-api-port: 8082

# Clé pour sécuriser l'API locale (à mettre dans la config de l'API Spring)
local-api-key: CHANGE_ME_PLUGIN

# Remplace l'IP réelle des joueurs par une pseudo-IP stable dans les données
# envoyées aux serveurs (les propriétaires de serveurs ne voient jamais la vraie IP)
mask-player-ips: true
# Clé secrète de la pseudo-IP (générée par le kit de déploiement)
ip-mask-key: ""

# Entrée IMG (lot 40) : les joueurs qui tapent cette adresse arrivent sur le lobby
# IMG (serveur MCS privé « pseudo/nom ») au lieu du lobby MCS. Vides = désactivé.
img-host: ""
img-lobby: ""
# Liste des serveurs du jeu quand on y entre img-host : icône (fichier, chemin
# relatif à ce dossier, ou URL ; n'importe quelle taille, réduite en 64×64) et
# message (codes couleur « & », \n pour la 2e ligne). Vides = ceux de Velocity.
img-icon: ""
img-motd: ""

# Site IMG Farm DB (lot 43) : /link CODE lie le compte Minecraft d'un joueur à son
# compte du site. URL locale du site et jeton (= MC_API_TOKEN du site). Vides = désactivé.
farmdb-url: ""
farmdb-token: ""
