# Lot 64 : compile le mod client Fabric « IMG Farm » (img-farm-mod) une fois par version de
# Minecraft listée dans img-farm-mod/versions.json, et publie les fichiers dans la release
# GitHub "mod-latest" (le site y envoie les membres : Mon profil → Mod Fabric).
#
# Lot 72 : chaque lundi, l'action regarde s'il existe une version stable de Minecraft plus récente
# que la dernière de versions.json ; si oui (et que Fabric API est sortie pour elle), elle la
# compile avec les autres et la publie si la compilation passe (versions.sh). Rien n'est écrit
# dans le dépôt : on peut ensuite ajouter la ligne à versions.json pour la garder pour de bon.
# Si la compilation échoue pour la nouvelle version, les autres fichiers sont quand même publiés :
# le mod d'une version plus ancienne se charge aussi sur les plus récentes (dépendance
# minecraft >= sa version) ; ce qui ne marche plus est coupé sans planter le jeu (Guard).
name: Mod

on:
  push:
    branches: [main]
    paths:
      - "img-farm-mod/**"
      - ".github/workflows/mod.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1" # lundi, vers 3 h 23 au Québec

permissions:
  contents: write

concurrency:
  group: mod-release
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      skip: ${{ steps.read.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        env:
          EVENT: ${{ github.event_name }}
        run: bash img-farm-mod/versions.sh img-farm-mod/versions.json

  build:
    needs: versions
    if: ${{ needs.versions.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: Minecraft ${{ matrix.minecraft }}${{ matrix.auto && ' (nouvelle)' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.2"

      - name: Compilation
        working-directory: img-farm-mod
        run: |
          # Lot 64b : en cas d'échec, les erreurs deviennent des annotations, lisibles sur la page
          # publique de l'action sans être connecté (le journal complet, lui, demande une connexion).
          set -o pipefail
          loader=()
          [ -n "${{ matrix.loader }}" ] && loader=(-Ploader_version="${{ matrix.loader }}")
          if ! gradle build --no-daemon \
              -Pminecraft_version="${{ matrix.minecraft }}" \
              -Pfabric_api_version="${{ matrix.fabric_api }}" "${loader[@]}" 2>&1 | tee build.log; then
            # Une seule annotation (GitHub n'en montre que 10 par étape) : les erreurs Java d'abord
            { grep -E "\.java:[0-9]+: error:" -A2 build.log || true; grep -E "^\* What went wrong" -A4 build.log || true; } \
              | grep -v "^--$" | head -45 | cut -c1-300 > errors.txt || true
            [ -s errors.txt ] || tail -30 build.log > errors.txt
            msg=$(sed 's/%/%25/g; s/\r//g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Mod ${{ matrix.minecraft }} : compilation échouée${{ matrix.auto && ' (nouvelle version, le mod est à adapter)' || '' }}::${msg}"
            exit 1
          fi
          mkdir -p ../dist
          cp build/libs/img-farm-mod-*+mc${{ matrix.minecraft }}.jar ../dist/
          ls -l ../dist

      - uses: actions/upload-artifact@v5
        with:
          name: mod-${{ matrix.minecraft }}
          path: dist/*.jar

  release:
    needs: [versions, build]
    if: ${{ !cancelled() && needs.versions.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: img-farm-mod/versions.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publication (release "mod-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          jars=(dist/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then echo "::warning::Aucune version compilée : rien à publier (voir les erreurs de compilation)"; exit 0; fi
          (cd dist && sha256sum *.jar > SHA256SUMS && cat SHA256SUMS)
          {
            echo "Mod client Fabric **IMG Farm** : sessions de farm (/imgfarm) envoyées sur le site de la team."
            echo
            echo "1. Installe [Fabric](https://fabricmc.net/use/) et [Fabric API](https://modrinth.com/mod/fabric-api) pour ta version de Minecraft."
            echo "2. Prends le fichier qui finit par ta version (ex. \`+mc26.3\`) et mets-le dans le dossier \`mods\`."
            echo "   Pas de fichier pour ta version ? Prends le plus récent : il marche en général sur les versions suivantes."
            echo "3. Sur le site : Mon profil → Mod Fabric → Lier le mod, puis en jeu \`/imgfarm lier CODE\`."
            echo
            echo "Fichiers :"
            for j in "${jars[@]}"; do
              f=$(basename "$j"); mc=${f##*+mc}; mc=${mc%.jar}
              if jq -e --arg v "$mc" 'any(.[]; .minecraft == $v)' img-farm-mod/versions.json >/dev/null; then
                echo "- \`$f\`"
              else
                echo "- \`$f\` (nouvelle version, compilée automatiquement : pas encore essayée en jeu)"
              fi
            done
            echo
            echo "Compilé automatiquement depuis ${GITHUB_SHA::7}."
          } > notes.md
          gh release delete mod-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create mod-latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mod IMG Farm (Fabric)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest=false
