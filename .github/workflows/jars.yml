# Lot 62 : compile l'API, le proxy (proxymanager) et le plugin img-farm (lot 66 : plus de plugin du lobby)
# à chaque modification, et les publie dans la release GitHub "jars-latest". mcs-deploy les
# télécharge au lieu de compiler sur le VPS (plus rapide, et rien de lourd sur le VPS) ; il
# compare l'empreinte git du dossier de chaque module (fichier TREES) avec son propre code et
# compile lui-même si GitHub n'a pas (encore) la bonne version.
name: Jars

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "proxymanager/**"
      - "img-farm-plugin/**"
      - ".github/workflows/jars.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jars-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Tests et compilation
        run: |
          # Lot 73 : les tests de chaque module passent avant sa publication. En cas d'échec, rien
          # n'est publié, mcs-deploy refuse de déployer ce code (voir prebuilt_jar) et les erreurs
          # sont en annotation, lisibles sur la page de l'action sans être connecté.
          mkdir -p dist
          set -o pipefail
          build() {
            local mod=$1 out=$2 jar
            echo "::group::$mod"
            if ! mvn -q -B -f "$mod/pom.xml" clean package 2>&1 | tee "$mod.log"; then
              echo "::endgroup::"
              msg=$({ grep -hE "^\[ERROR\] (Tests run|.*(FAIL|expected|Expected|COMPILATION|error:|\.java))" "$mod.log" \
                        "$mod"/target/surefire-reports/*.txt 2>/dev/null || tail -30 "$mod.log"; } \
                    | head -40 | cut -c1-300 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::error title=$mod : tests ou compilation échoués::${msg}"
              exit 1
            fi
            jar=$(find "$mod/target" -maxdepth 1 -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' \
                  ! -name '*-javadoc.jar' -printf '%T@ %p\n' | sort -rn | awk 'NR == 1 { print $2 }')
            cp "$jar" "dist/$out"
            echo "$out $(git rev-parse "HEAD:$mod")" >> dist/TREES
            echo "::endgroup::"
          }
          build api mcs-api.jar
          build proxymanager proxymanager.jar
          build img-farm-plugin img-farm.jar
          cd dist && sha256sum *.jar > SHA256SUMS && cat TREES SHA256SUMS

      - name: Publication (release "jars-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jars-latest --yes --cleanup-tag || true
          gh release create jars-latest dist/* \
            --title "Jars MCS (dernière version)" \
            --notes "API, proxy et plugin img-farm, compilés automatiquement depuis ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --latest=false
