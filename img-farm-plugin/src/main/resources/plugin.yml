name: ImgFarm
version: ${project.version}
main: vinch.img.farm.ImgFarmPlugin
api-version: '1.21'
authors: [IMG]
softdepend: [WorldReset]
description: Sessions de farm mesurées en jeu, envoyées au site IMG Farm DB par le proxy
commands:
  farm:
    description: Meilleures méthodes du site pour un item, ou mesurer une session de farm pour le site de la team
    usage: /farm
  menu:
    description: Menu IMG — tes serveurs, créer un serveur, la farm
    usage: /menu
  jouer:
    description: Rejoindre un serveur à la demande (speedrun, monde neuf…) — pour les PNJ du lobby
    usage: /jouer <jeu>
  limbo:
    description: Retour aux panneaux de WorldReset (la partie en cours est gardée)
    usage: /limbo
    aliases: [panneaux]
  setspawn:
    description: Le spawn du serveur est ici (arrivée à chaque connexion) — admins
    usage: /setspawn
  spawn:
    description: Retour au spawn du serveur
    usage: /spawn
permissions:
  imgfarm.spawn.set:
    description: /setspawn
    default: op
